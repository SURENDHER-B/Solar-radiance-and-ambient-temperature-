name: Porur Weather Logger

on:
  schedule:
    # Runs every hour (you can adjust cron syntax as needed)
    - cron: '0 * * * *'
  workflow_dispatch: # Allows you to run it manually anytime from GitHub

jobs:
  log-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run weather logging script
        run: python log_weather.py

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add porur_cloud_weather_log.csv
          git commit -m "Auto-logged weather data [skip ci]" || echo "No changes to commit"
          git push
